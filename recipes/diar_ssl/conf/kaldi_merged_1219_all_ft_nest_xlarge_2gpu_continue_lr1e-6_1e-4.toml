[meta]
save_dir = "exp"
seed = 3407

[finetune]
finetune = true
ckpt_dir = "/root/code/github_repos/DiariZen/recipes/diar_ssl/exp/kaldi_merged_1219_all_ft_nest_xlarge_2gpu/checkpoints/epoch_0007"

[trainer]
path = "trainer_dual_opt.Trainer"
[trainer.args]
max_epochs = 30
gradient_percentile = 90
gradient_history_size = 1000
save_max_score = false
save_ckpt_interval = 1
max_patience = 10
max_num_checkpoints = 100
gradient_accumulation_steps = 1
validation_interval = 1
scheduler_name = "cosine_schedule_with_warmup"
warmup_steps = 100
warmup_ratio = 0.0
freeze_wavlm = false
lr_decay = false
use_one_cycle_lr = false

[optimizer_small]
path = "torch.optim.AdamW"
[optimizer_small.args]
lr = 1e-6

[optimizer_big]
path = "torch.optim.AdamW"
[optimizer_big.args]
lr = 1e-4

[model]
path = "diarizen.models.eend.model_nemo_nest_conformer.Model"
[model.args]
nest_model_name = "nvidia/ssl_en_nest_xlarge_v1.0"
nemo_root = "/root/code/github_repos/NeMo"
nest_layers = "all"
nest_layer_num = 0
nest_feat_dim = 0
attention_in = 256
ffn_hidden = 1024
num_head = 4
num_layer = 4
dropout = 0.1
chunk_size = 8
use_posi = true
output_activate_function = false
selected_channel = 0
max_speakers_per_chunk = 4
max_speakers_per_frame = 4

[train_dataset]
path = "dataset.DiarizationDataset"
[train_dataset.args]
scp_file = "data/kaldi_merged_1219_all_ft_nest_xlarge_2gpu_continue_lr1e-6_1e-4/train/wav.scp"
rttm_file = "data/kaldi_merged_1219_all_ft_nest_xlarge_2gpu_continue_lr1e-6_1e-4/train/rttm"
uem_file = "data/kaldi_merged_1219_all_ft_nest_xlarge_2gpu_continue_lr1e-6_1e-4/train/all.uem"
chunk_size = 8
chunk_shift = 6
sample_rate = 16000
full_utterance = true
max_sessions = 0
max_chunks = 0

[train_dataset.dataloader]
batch_size = 64
num_workers = 4
prefetch_factor = 2
persistent_workers = true
drop_last = true
pin_memory = true

[validate_dataset]
path = "dataset.DiarizationDataset"
[validate_dataset.args]
scp_file = "data/kaldi_merged_1219_all_ft_nest_xlarge_2gpu_continue_lr1e-6_1e-4/dev/wav.scp"
rttm_file = "data/kaldi_merged_1219_all_ft_nest_xlarge_2gpu_continue_lr1e-6_1e-4/dev/rttm"
uem_file = "data/kaldi_merged_1219_all_ft_nest_xlarge_2gpu_continue_lr1e-6_1e-4/dev/all.uem"
chunk_size = 8
chunk_shift = 8
sample_rate = 16000
full_utterance = true
max_sessions = 0
max_chunks = 0

[validate_dataset.dataloader]
batch_size = 64
num_workers = 4
prefetch_factor = 2
persistent_workers = true
drop_last = true
pin_memory = true
